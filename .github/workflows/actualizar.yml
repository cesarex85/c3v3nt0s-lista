name: Generar y publicar c3v3nt0s.m3u

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 8 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar script de limpieza
        env:
          URL_ORIGEN: ${{ secrets.URL_ORIGEN }}
          URL_PETICIONES: ${{ secrets.URL_PETICIONES }}
          PALABRA_CLAVE: ${{ secrets.PALABRA_CLAVE }}
        run: python generar_lista.py

      - name: Publicar c3v3nt0s.m3u en rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
